# n8n → GitHub Actions Bridge
# This workflow auto-builds and deploys the portfolio to GitHub Pages
# whenever code is pushed to main branch. Replaces manual npm run deploy.

name: 🚀 Auto Deploy Portfolio

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # Can also be triggered manually from GitHub UI

permissions:
  contents: write           # Required to push to gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build portfolio
        run: npm run build
        env:
          NODE_ENV: production

      - name: 🌐 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore: auto-deploy portfolio [skip ci]'
