    <style>
      /* Keep the original portfolio, but make Skills and Projects more compact. */
      #skills .section-padding, #projects .section-padding { padding-top: 3rem !important; padding-bottom: 3rem !important; }
      #skills .grid, #projects .grid { gap: 1rem !important; }
      #skills .clean-card, #projects .clean-card { padding: 1rem !important; }
      #skills h3, #projects h3 { font-size: 1.05rem !important; }
      #skills p, #projects p { font-size: .82rem !important; line-height: 1.45 !important; }
      #projects [data-extra-project] { display: none; }
      #projects .view-more-projects { display: flex; margin: 1.5rem auto 0; padding: .65rem 1.25rem; border: 1px solid rgba(96,165,250,.5); border-radius: .75rem; background: rgba(59,130,246,.12); color: #bfdbfe; font: 500 .8rem JetBrains Mono, monospace; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const compactProjects = () => {
          const section = document.querySelector('#projects');
          const grid = section && section.querySelector('.grid');
          if (!grid || grid.dataset.compactReady) return;
          const cards = Array.from(grid.children).filter((card) => card.querySelector('h3'));
          if (cards.length <= 3) return;
          grid.dataset.compactReady = 'true';
          cards.slice(3).forEach((card) => { card.dataset.extraProject = 'true'; });
          const button = document.createElement('button');
          button.className = 'view-more-projects';
          button.type = 'button';
          button.textContent = `View more projects (${cards.length - 3})`;
          button.addEventListener('click', () => {
            cards.slice(3).forEach((card) => { card.style.display = ''; });
            button.remove();
          });
          section.appendChild(button);
        };
        const observer = new MutationObserver(compactProjects);
        observer.observe(document.getElementById('root'), { childList: true, subtree: true });
        setTimeout(compactProjects, 500);
        setTimeout(compactProjects, 1500);
      })();
    </script>
  </body>
