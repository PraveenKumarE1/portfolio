    <style>
      /* Compact Skills and Projects only; all other sections remain unchanged. */
      #skills .section-padding,
      #projects .section-padding {
        padding-top: 1.5rem !important;
        padding-bottom: 1.5rem !important;
      }
      #skills .grid,
      #projects .grid {
        gap: .5rem !important;
      }
      #skills .clean-card,
      #projects .clean-card {
        padding: .55rem !important;
      }
      #skills h3,
      #projects h3 {
        font-size: .9rem !important;
      }
      #skills p,
      #projects p {
        font-size: .75rem !important;
        line-height: 1.3 !important;
      }
      #skills .space-y-4 {
        gap: .35rem !important;
      }
      #skills .h-\[2px\] {
        height: 1px !important;
      }
      #projects .view-more-projects {
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 1rem auto 0;
        padding: .55rem 1rem;
        border: 1px solid rgba(96,165,250,.45);
        border-radius: .65rem;
        background: linear-gradient(to right, rgba(37,99,235,.18), rgba(79,70,229,.18));
        color: #dbeafe;
        font: 500 .75rem "JetBrains Mono", monospace;
        cursor: pointer;
        transition: all .2s ease;
      }
      #projects .view-more-projects:hover {
        background: linear-gradient(to right, #2563eb, #4f46e5);
        border-color: transparent;
        color: white;
        box-shadow: 0 6px 16px rgba(37,99,235,.2);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const compactProjects = () => {
          const section = document.querySelector('#projects');
          if (!section) return;

          const grid = section.querySelector('.grid');
          if (!grid || grid.dataset.compactReady) return;

          const cards = Array.from(grid.children).filter((card) => card.querySelector('h3'));
          if (cards.length <= 3) return;

          grid.dataset.compactReady = 'true';
          const hiddenCards = cards.slice(3);
          hiddenCards.forEach((card) => {
            card.dataset.extraProject = 'true';
            card.style.display = 'none';
          });

          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'view-more-projects';
          button.textContent = `Show more projects (${hiddenCards.length})`;
          button.addEventListener('click', () => {
            hiddenCards.forEach((card) => {
              card.style.display = '';
            });
            button.remove();
          });

          section.appendChild(button);
        };

        const observer = new MutationObserver(() => compactProjects());
        const root = document.getElementById('root');
        if (root) observer.observe(root, { childList: true, subtree: true });
        setTimeout(compactProjects, 500);
        setTimeout(compactProjects, 1500);
      })();
    </script>
  </body>
