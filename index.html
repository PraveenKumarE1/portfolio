    <style>
      /* ===== 2026 Portfolio Refresh ===== */
      :root{--bg-main:#050816;--card-bg:rgba(255,255,255,.045);--card-border:rgba(255,255,255,.11);--accent:#67e8f9;--accent2:#a78bfa}
      html{background:#050816!important;scrollbar-color:#67e8f955 #050816!important}
      body{background:radial-gradient(circle at 12% 12%,rgba(103,232,249,.10),transparent 28%),radial-gradient(circle at 88% 18%,rgba(167,139,250,.12),transparent 30%),radial-gradient(circle at 50% 100%,rgba(59,130,246,.08),transparent 35%),#050816!important}
      body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,black,transparent 85%)}
      .clean-card{background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025))!important;border:1px solid rgba(255,255,255,.10)!important;box-shadow:0 18px 50px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.05);border-radius:18px!important}
      .clean-card:hover{border-color:rgba(103,232,249,.35)!important;box-shadow:0 20px 60px rgba(34,211,238,.10),inset 0 1px 0 rgba(255,255,255,.08);transform:translateY(-5px)!important}
      /* Technical skills: compact visiting-card style */
      #skills .section-padding{padding-top:3rem!important;padding-bottom:3rem!important}
      #skills .grid{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:.75rem!important;padding:0!important}
      #skills .grid::before{display:none!important}
      #skills .clean-card{min-height:auto!important;padding:.8rem!important;border-radius:12px!important;display:flex!important;flex-direction:column!important;justify-content:center!important;gap:.3rem!important;position:relative!important;overflow:hidden!important}
      #skills .clean-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(#67e8f9,#a78bfa);box-shadow:0 0 12px rgba(103,232,249,.45)}
      #skills .clean-card h3{font-size:.78rem!important;font-weight:700!important;letter-spacing:.01em!important}
      #skills .clean-card p{font-size:.62rem!important;line-height:1.35!important;color:#94a3b8!important;margin:0!important}
      #skills .clean-card svg{width:14px!important;height:14px!important}
      #skills .space-y-4{gap:.2rem!important}
      #skills .h-\[2px\]{height:1px!important;opacity:.35!important}
      @media(max-width:700px){#skills .grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:.6rem!important}}
      /* Modern glass navigation and sections */
      nav,header{backdrop-filter:blur(20px)!important;-webkit-backdrop-filter:blur(20px)!important}
      section{scroll-margin-top:80px}::selection{background:rgba(103,232,249,.25)!important;color:white!important}
      /* New 3D loading screen */
      #portfolio-loader{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:#050816;transition:opacity .55s ease,visibility .55s ease}
      #portfolio-loader.done{opacity:0;visibility:hidden;pointer-events:none}
      #portfolio-loader .loader-wrap{text-align:center;perspective:700px}
      #portfolio-loader .cube{width:54px;height:54px;margin:0 auto 18px;position:relative;transform-style:preserve-3d;animation:portfolioCube 2.1s linear infinite}
      #portfolio-loader .cube span{position:absolute;inset:0;border:1px solid rgba(103,232,249,.75);background:linear-gradient(135deg,rgba(103,232,249,.12),rgba(167,139,250,.12));box-shadow:inset 0 0 22px rgba(103,232,249,.08),0 0 24px rgba(103,232,249,.08)}
      #portfolio-loader .cube span:nth-child(1){transform:translateZ(27px)}#portfolio-loader .cube span:nth-child(2){transform:rotateY(180deg) translateZ(27px)}#portfolio-loader .cube span:nth-child(3){transform:rotateY(90deg) translateZ(27px)}#portfolio-loader .cube span:nth-child(4){transform:rotateY(-90deg) translateZ(27px)}#portfolio-loader .cube span:nth-child(5){transform:rotateX(90deg) translateZ(27px)}#portfolio-loader .cube span:nth-child(6){transform:rotateX(-90deg) translateZ(27px)}
      #portfolio-loader .loader-title{color:#e2e8f0;font:600 .78rem "Space Grotesk",sans-serif;letter-spacing:.24em;text-transform:uppercase}
      #portfolio-loader .loader-sub{color:#64748b;font:400 .62rem "JetBrains Mono",monospace;margin-top:7px}
      #portfolio-loader .loader-line{width:130px;height:2px;margin:14px auto 0;overflow:hidden;background:rgba(255,255,255,.08);border-radius:99px}
      #portfolio-loader .loader-line::after{content:"";display:block;width:45%;height:100%;background:linear-gradient(90deg,#67e8f9,#a78bfa);animation:portfolioLine 1.1s ease-in-out infinite}
      @keyframes portfolioCube{to{transform:rotateX(360deg) rotateY(360deg) rotateZ(90deg)}}@keyframes portfolioLine{0%{transform:translateX(-120%)}100%{transform:translateX(300%)}}

      /* Projects: preserve the existing compact view-more behavior. */
      #projects .section-padding { padding-top: 1.25rem !important; padding-bottom: 1.25rem !important; }
      #projects .grid { gap: .4rem !important; }
      #projects .clean-card { padding: .55rem !important; }
      #projects .view-more-projects {
        display: flex; align-items: center; justify-content: center; margin: .85rem auto 0;
        padding: .5rem 1rem; border: 1px solid rgba(96,165,250,.45); border-radius: .65rem;
        background: linear-gradient(to right, rgba(37,99,235,.18), rgba(79,70,229,.18));
        color: #dbeafe; font: 500 .75rem "JetBrains Mono", monospace; cursor: pointer; transition: all .2s ease;
      }
      #projects .view-more-projects:hover { background: linear-gradient(to right, #2563eb, #4f46e5); border-color: transparent; color: white; box-shadow: 0 6px 16px rgba(37,99,235,.2); }

      /* Technical Disciplines: use a compact Experience-style timeline layout only here. */
      #skills .section-padding { padding-top: 1.5rem !important; padding-bottom: 1.5rem !important; }
      #skills .grid { position: relative; display: grid; grid-template-columns: 1fr !important; gap: 1rem !important; padding-left: 1.25rem; }
      #skills .grid::before { content: ""; position: absolute; left: .25rem; top: .5rem; bottom: .5rem; width: 1px; background: linear-gradient(#3b82f6, #8b5cf6, transparent); }
      #skills .clean-card { position: relative; padding: .75rem 1rem !important; min-height: 0 !important; border-radius: .75rem !important; background: rgba(255,255,255,.025) !important; }
      #skills .clean-card::before { content: ""; position: absolute; left: -1.25rem; top: 1rem; width: .55rem; height: .55rem; border: 2px solid #60a5fa; border-radius: 999px; background: #07070a; box-shadow: 0 0 0 3px rgba(59,130,246,.12); }
      #skills .clean-card h3 { font-size: .9rem !important; line-height: 1.2 !important; }
      #skills .clean-card p { font-size: .7rem !important; line-height: 1.3 !important; margin-top: .2rem !important; }
      #skills .clean-card svg { width: 15px !important; height: 15px !important; }
      #skills .space-y-4 { gap: .3rem !important; }
      #skills .h-\[2px\] { height: 1px !important; }

  <body>
    <div id="portfolio-loader"><div class="loader-wrap"><div class="cube"><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="loader-title">PRAVEEN KUMAR</div><div class="loader-sub">AI • DATA • FULL STACK</div><div class="loader-line"></div></div></div><div id="root"></div>
    <script>
      (() => {
        const compactProjects = () => {
          const section = document.querySelector('#projects');
          if (!section || section.dataset.compactReady) return;
          const grid = section.querySelector('.grid');
          if (!grid) return;
          const cards = Array.from(grid.children).filter((card) => card.querySelector('h3'));
          if (cards.length <= 3) return;
          section.dataset.compactReady = 'true';
          const hiddenCards = cards.slice(3);
          hiddenCards.forEach((card) => { card.dataset.extraProject = 'true'; card.style.display = 'none'; });
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'view-more-projects';
          button.textContent = 'Show more projects';
          button.addEventListener('click', () => { hiddenCards.forEach((card) => { card.style.display = ''; }); button.remove(); });
          section.appendChild(button);
        };
        const root = document.getElementById('root');
        if (root) new MutationObserver(compactProjects).observe(root, { childList: true, subtree: true });
        setTimeout(compactProjects, 500);
        setTimeout(compactProjects, 1500);
      })();
    </script>
  <script>setTimeout(()=>document.getElementById("portfolio-loader")?.classList.add("done"),1400);</script>
  </body>
